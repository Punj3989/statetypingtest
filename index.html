<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>apna word · typing test (auto next + timer)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        .test-container {
            background: rgba(18, 22, 30, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 36px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #eef3fc;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            padding-left: 8px;
            flex-wrap: wrap;
        }

        h1 span {
            background: #2a3140;
            padding: 6px 18px;
            font-size: 1rem;
            border-radius: 60px;
            font-weight: 400;
            color: #b9c8e6;
            border: 1px solid #3d4559;
            letter-spacing: 0.3px;
        }

        /* 🕐 DIGITAL TIMER BADGE */
        .timer-badge {
            background: #1a2230;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            color: #9fda8f;
            border: 1px solid #3a5a3a;
            letter-spacing: 2px;
            font-family: 'Fira Mono', 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(159, 218, 143, 0.15);
        }

        .timer-badge .timer-icon {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .timer-badge.running {
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 8px rgba(159, 218, 143, 0.2); }
            100% { box-shadow: 0 0 18px rgba(159, 218, 143, 0.4); }
        }

        .word-stream-panel {
            background: #0b0f17;
            border-radius: 28px;
            padding: 28px 24px;
            margin-bottom: 26px;
            border: 1px solid #242b38;
            box-shadow: 0 12px 24px -12px #00000080;
            height: 220px;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        .word-stream-panel::-webkit-scrollbar {
            width: 8px;
        }
        .word-stream-panel::-webkit-scrollbar-track {
            background: #0b0f17;
            border-radius: 10px;
        }
        .word-stream-panel::-webkit-scrollbar-thumb {
            background: #2f394b;
            border-radius: 10px;
        }
        .word-stream-panel::-webkit-scrollbar-thumb:hover {
            background: #4a5a75;
        }

        .word-stream {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 22px;
            font-family: 'Fira Mono', 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            line-height: 1.6;
            letter-spacing: 0.5px;
            width: 100%;
            padding: 10px 0;
        }

        .word-stream .word {
            color: #6b7d9c;
            transition: color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
            scroll-margin: 80px;
        }

        .word-stream .word.done {
            color: #3f5f3f;
            opacity: 0.35;
        }

        .word-stream .word.active {
            color: #eef3fc;
            background: #18243a;
            box-shadow: 0 0 0 2px #4a6a9a;
        }

        .word-stream .word.error {
            color: #f08080;
            background: #2a1416;
            box-shadow: 0 0 0 2px #a04040;
        }

        .word-stream .word.skipped {
            color: #d4b060;
            opacity: 0.5;
            text-decoration: line-through;
        }

        .typing-input {
            width: 100%;
            background: #0e121b;
            border: 2px solid #2f394b;
            border-radius: 28px;
            padding: 22px 28px;
            font-size: 1.6rem;
            font-family: 'Fira Mono', 'JetBrains Mono', monospace;
            color: #eef3fc;
            outline: none;
            transition: 0.15s;
            letter-spacing: 1.5px;
            box-shadow: 0 10px 20px -10px #000000b0;
            margin-bottom: 20px;
        }

        .typing-input:focus {
            border-color: #6d8ec9;
            background: #121a28;
            box-shadow: 0 0 0 5px rgba(109, 142, 201, 0.2);
        }

        .typing-input.correct-glow {
            border-color: #6fae6f;
            box-shadow: 0 0 0 5px rgba(111, 174, 111, 0.2);
            background: #111c16;
        }

        .typing-input.error-glow {
            border-color: #c76b6b;
            box-shadow: 0 0 0 5px rgba(199, 107, 107, 0.2);
            background: #1a1214;
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #151b26;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #2a3140;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7d9c;
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 600;
            color: #d6e3ff;
            font-family: 'Fira Mono', monospace;
            min-width: 50px;
            text-align: center;
        }

        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .actions button {
            background: #1f2736;
            border: 1px solid #364153;
            border-radius: 60px;
            padding: 14px 34px;
            font-size: 1rem;
            font-weight: 500;
            color: #c9d7f0;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 10px -6px #00000080;
        }

        .actions button:hover {
            background: #2d384b;
            border-color: #5b6d8a;
            color: #ffffff;
        }

        .actions button:active {
            transform: scale(0.97);
        }

        .actions button.skip-btn {
            background: #2d2a1f;
            border-color: #5a4d2e;
            color: #f0d9a0;
        }

        .actions button.skip-btn:hover {
            background: #3d3826;
            border-color: #7a6838;
            color: #ffe8b0;
        }

        .message-box {
            text-align: center;
            margin-top: 24px;
            font-size: 0.95rem;
            min-height: 28px;
            color: #8a9bb8;
            letter-spacing: 0.3px;
            font-style: italic;
        }

        .footer-note {
            text-align: center;
            margin-top: 14px;
            font-size: 0.8rem;
            color: #4b576b;
            letter-spacing: 0.6px;
        }

        .accent-badge {
            color: #84a6e0;
            font-weight: 500;
        }

        .progress-badge {
            background: #1a2230;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #8da1c7;
            border: 1px solid #2c384b;
            margin-left: 10px;
        }

        .wpm-badge-live {
            background: #1a2a1a;
            border-color: #3a5a3a;
            color: #9fda8f;
        }

        .result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 14, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .result-overlay.show {
            display: flex;
        }

        .result-card {
            background: linear-gradient(145deg, #141a26 0%, #1c2434 100%);
            border-radius: 40px;
            padding: 44px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 1px solid #2f3a4e;
            box-shadow: 0 30px 60px -20px #000000e0;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-card h2 {
            font-size: 1.6rem;
            font-weight: 500;
            color: #eef3fc;
            margin-bottom: 8px;
        }

        .result-sub {
            font-size: 0.9rem;
            color: #6b7d9c;
            margin-bottom: 28px;
        }

        .wpm-display {
            font-size: 5rem;
            font-weight: 700;
            color: #9fda8f;
            font-family: 'Fira Mono', monospace;
            line-height: 1;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(159, 218, 143, 0.35);
            letter-spacing: -2px;
        }

        .wpm-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #6b7d9c;
            margin-bottom: 32px;
        }

        /* 🕐 TIME DISPLAY IN RESULT */
        .time-display {
            font-size: 2.2rem;
            font-weight: 700;
            color: #84a6e0;
            font-family: 'Fira Mono', monospace;
            line-height: 1;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(132, 166, 224, 0.35);
            letter-spacing: 1px;
        }

        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #6b7d9c;
            margin-bottom: 28px;
        }

        .result-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 32px;
        }

        .result-stat-box {
            background: #0e131d;
            border-radius: 20px;
            padding: 16px 12px;
            border: 1px solid #232c3b;
        }

        .result-stat-box .rs-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5d6d88;
            margin-bottom: 6px;
        }

        .result-stat-box .rs-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #d6e3ff;
            font-family: 'Fira Mono', monospace;
        }

        .result-stat-box .rs-value.green { color: #9fda8f; }
        .result-stat-box .rs-value.red { color: #e08585; }
        .result-stat-box .rs-value.yellow { color: #f0c674; }

        .result-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-actions button {
            border: none;
            border-radius: 60px;
            padding: 14px 32px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .result-actions .btn-primary {
            background: linear-gradient(135deg, #4a7a4a 0%, #3a663a 100%);
            color: #e8f5e0;
            box-shadow: 0 8px 20px -8px rgba(74, 122, 74, 0.6);
        }

        .result-actions .btn-primary:hover {
            background: linear-gradient(135deg, #5a8f5a 0%, #4a7a4a 100%);
            transform: translateY(-2px);
        }

        .result-actions .btn-secondary {
            background: #232c3b;
            color: #b9c8e6;
            border: 1px solid #364153;
        }

        .result-actions .btn-secondary:hover {
            background: #2d384b;
            color: #ffffff;
        }

        @media (max-width: 700px) {
            .word-stream {
                font-size: 1.1rem;
                gap: 8px 14px;
            }
            .word-stream-panel {
                height: 180px;
            }
            .timer-badge {
                font-size: 0.85rem;
                padding: 4px 14px;
            }
        }
    </style>
</head>
<body>
<div class="test-container">
    <h1>
        ⌨️ apna word
        <span id="wordCountBadge">countries</span>
        <span class="progress-badge" id="progressBadge">1 / 0</span>
        <!-- 🕐 DIGITAL TIMER -->
        <span class="timer-badge" id="timerBadge">
            <span class="timer-icon">⏱</span>
            <span id="timerDisplay">00:00.0</span>
        </span>
    </h1>

    <div class="word-stream-panel" id="wordStreamPanel">
        <div class="word-stream" id="wordStream"></div>
    </div>

    <input type="text" id="typingInput" class="typing-input" placeholder="type here..." autocomplete="off" spellcheck="false" autofocus>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">accuracy</span>
            <span class="stat-value" id="accuracyStat">100%</span>
        </div>
        <div class="stat-item wpm-badge-live" id="wpmLiveBadge">
            <span class="stat-label">wpm</span>
            <span class="stat-value" id="wpmStat">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">errors</span>
            <span class="stat-value" id="errorStat">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">typed</span>
            <span class="stat-value" id="typedStat">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">skipped</span>
            <span class="stat-value" id="skippedStat">0</span>
        </div>
    </div>

    <div class="actions" style="margin-top: 18px;">
        <button id="skipBtn" class="skip-btn" title="Skip this word (Alt + S)">
            <span>⏭</span> Skip word
        </button>
        <button id="restartBtn" title="Restart entire test">
            <span>⟳</span> Restart test
        </button>
    </div>

    <div id="messageBox" class="message-box"></div>
    <div class="footer-note">
        word complete hote hi automatic next · 
        <span class="accent-badge">Alt + S</span> or <span class="accent-badge">Skip button</span> to skip
    </div>
</div>

<div class="result-overlay" id="resultOverlay">
    <div class="result-card">
        <h2>🎉 test complete!</h2>
        <div class="result-sub">aapka typing result</div>

        <div class="wpm-display" id="finalWpm">0</div>
        <div class="wpm-label">words per minute</div>

        <!-- 🕐 TOTAL TIME DISPLAY -->
        <div class="time-display" id="finalTime">00:00.0</div>
        <div class="time-label">total time</div>

        <div class="result-stats-grid">
            <div class="result-stat-box">
                <div class="rs-label">accuracy</div>
                <div class="rs-value green" id="finalAccuracy">100%</div>
            </div>
            <div class="result-stat-box">
                <div class="rs-label">total typed</div>
                <div class="rs-value" id="finalTyped">0</div>
            </div>
            <div class="result-stat-box">
                <div class="rs-label">errors</div>
                <div class="rs-value red" id="finalErrors">0</div>
            </div>
            <div class="result-stat-box">
                <div class="rs-label">skipped</div>
                <div class="rs-value yellow" id="finalSkipped">0</div>
            </div>
        </div>

        <div class="result-actions">
            <button class="btn-primary" id="playAgainBtn">
                <span>⟳</span> play again
            </button>
            <button class="btn-secondary" id="closeResultBtn">
                close
            </button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // FULL COUNTRY LIST (200+)
    // ============================================================
    const RAW_WORDS = `
andhra pradesh
arunachal pradesh
assam
bihar
chhattisgarh
goa
gujarat
haryana
himachal pradesh
jharkhand
karnataka
kerala
madhya pradesh
maharashtra
manipur
meghalaya
mizoram
nagaland
odisha
punjab
rajasthan
sikkim
tamil nadu
telangana
tripura
uttar pradesh
uttarakhand
west bengal
    `;

    const WORD_LIST = RAW_WORDS
        .split(/[\n\r,]+/)
        .map(w => w.trim())
        .filter(w => w.length > 0);

    // ----- DOM elements -----
    const wordStreamPanel = document.getElementById('wordStreamPanel');
    const wordStream = document.getElementById('wordStream');
    const typingInput = document.getElementById('typingInput');
    const accuracyStat = document.getElementById('accuracyStat');
    const errorStat = document.getElementById('errorStat');
    const typedStat = document.getElementById('typedStat');
    const skippedStat = document.getElementById('skippedStat');
    const wpmStat = document.getElementById('wpmStat');
    const restartBtn = document.getElementById('restartBtn');
    const skipBtn = document.getElementById('skipBtn');
    const messageBox = document.getElementById('messageBox');
    const progressBadge = document.getElementById('progressBadge');
    const wordCountBadge = document.getElementById('wordCountBadge');

    // 🕐 timer elements
    const timerBadge = document.getElementById('timerBadge');
    const timerDisplay = document.getElementById('timerDisplay');
    const finalTime = document.getElementById('finalTime');

    const resultOverlay = document.getElementById('resultOverlay');
    const finalWpm = document.getElementById('finalWpm');
    const finalAccuracy = document.getElementById('finalAccuracy');
    const finalTyped = document.getElementById('finalTyped');
    const finalErrors = document.getElementById('finalErrors');
    const finalSkipped = document.getElementById('finalSkipped');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const closeResultBtn = document.getElementById('closeResultBtn');

    // ----- state -----
    let allWords = [];
    let currentIndex = 0;
    let currentWord = '';
    let wordStatus = [];

    let sessionTotalTyped = 0;
    let sessionErrorCount = 0;
    let sessionSkippedCount = 0;

    let currentAttemptTotalTyped = 0;
    let currentAttemptErrors = 0;

    let isTransitioning = false;

    let testStartTime = null;
    let testEndTime = null;
    let wpmInterval = null;
    let timerInterval = null;   // 🕐

    // ----- helpers -----
    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function calculateWPM() {
        if (!testStartTime) return 0;
        const endTime = testEndTime || Date.now();
        const minutesElapsed = (endTime - testStartTime) / 1000 / 60;
        if (minutesElapsed <= 0) return 0;
        return Math.max(0, Math.round((sessionTotalTyped / 5) / minutesElapsed));
    }

    // 🕐 format ms → MM:SS.d
    function formatTime(ms) {
        if (ms < 0) ms = 0;
        const totalSeconds = ms / 1000;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = Math.floor(totalSeconds % 60);
        const tenths = Math.floor((ms % 1000) / 100);
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`;
    }

    // 🕐 update live timer display
    function updateTimerDisplay() {
        if (!testStartTime) {
            timerDisplay.textContent = '00:00.0';
            return;
        }
        const now = testEndTime || Date.now();
        const elapsed = now - testStartTime;
        timerDisplay.textContent = formatTime(elapsed);
    }

    function startWpmTracking() {
        testStartTime = Date.now();
        testEndTime = null;
        if (wpmInterval) clearInterval(wpmInterval);
        wpmInterval = setInterval(() => {
            if (testStartTime && !testEndTime) {
                wpmStat.textContent = calculateWPM();
            }
        }, 500);
    }

    // 🕐 start timer tracking
    function startTimerTracking() {
        if (timerInterval) clearInterval(timerInterval);
        timerBadge.classList.add('running');
        timerInterval = setInterval(() => {
            if (testStartTime && !testEndTime) {
                updateTimerDisplay();
            }
        }, 100); // 100ms = tenths of second
    }

    function stopWpmTracking() {
        testEndTime = Date.now();
        if (wpmInterval) {
            clearInterval(wpmInterval);
            wpmInterval = null;
        }
        // 🕐 stop timer
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timerBadge.classList.remove('running');
        updateTimerDisplay(); // final update
    }

    function scrollToActiveWord() {
        const activeEl = wordStream.querySelector('.word.active');
        if (!activeEl) return;

        const panelRect = wordStreamPanel.getBoundingClientRect();
        const activeRect = activeEl.getBoundingClientRect();

        const isAbove = activeRect.top < panelRect.top + 20;
        const isBelow = activeRect.bottom > panelRect.bottom - 20;

        if (isAbove || isBelow) {
            const targetScroll = activeEl.offsetTop - (wordStreamPanel.clientHeight / 2) + (activeEl.clientHeight / 2);
            wordStreamPanel.scrollTo({
                top: Math.max(0, targetScroll),
                behavior: 'smooth'
            });
        }
    }

    function renderWordStream() {
        wordStream.innerHTML = '';

        allWords.forEach((word, idx) => {
            const span = document.createElement('span');
            span.className = 'word';
            span.textContent = word;
            span.dataset.index = idx;

            const status = wordStatus[idx];
            if (status === 'done') span.classList.add('done');
            else if (status === 'active') span.classList.add('active');
            else if (status === 'error') span.classList.add('error');
            else if (status === 'skipped') span.classList.add('skipped');

            wordStream.appendChild(span);
        });

        scrollToActiveWord();
    }

    function updateStatsDisplay() {
        typedStat.textContent = sessionTotalTyped;
        errorStat.textContent = sessionErrorCount;
        skippedStat.textContent = sessionSkippedCount;

        let accuracy = 100;
        if (sessionTotalTyped > 0) {
            const correct = sessionTotalTyped - sessionErrorCount;
            accuracy = Math.max(0, Math.round((correct / sessionTotalTyped) * 100));
        }
        accuracyStat.textContent = accuracy + '%';

        if (testStartTime && !testEndTime) {
            wpmStat.textContent = calculateWPM();
        }
    }

    function updateProgressBadge() {
        const total = allWords.length;
        const doneCount = wordStatus.filter(s => s === 'done' || s === 'skipped').length;
        if (doneCount >= total) {
            progressBadge.textContent = `${total} / ${total}`;
        } else {
            progressBadge.textContent = `${doneCount + 1} / ${total}`;
        }
    }

    function showMessage(text, color = '#8a9bb8') {
        messageBox.textContent = text;
        messageBox.style.color = color;
    }

    function moveToNextWord() {
        let nextIdx = -1;
        for (let i = currentIndex + 1; i < allWords.length; i++) {
            if (wordStatus[i] === 'pending') {
                nextIdx = i;
                break;
            }
        }

        if (nextIdx === -1) {
            for (let i = 0; i < allWords.length; i++) {
                if (wordStatus[i] === 'pending') {
                    nextIdx = i;
                    break;
                }
            }
        }

        if (nextIdx === -1) {
            currentIndex = -1;
            currentWord = '';
            typingInput.value = '';
            typingInput.disabled = true;
            typingInput.placeholder = 'all words completed!';
            showMessage('🎉 congratulations! you finished all countries.', '#9fda8f');
            renderWordStream();
            updateProgressBadge();

            setTimeout(() => {
                showResult();
            }, 400);
            return;
        }

        currentIndex = nextIdx;
        currentWord = allWords[currentIndex];
        wordStatus[currentIndex] = 'active';

        typingInput.value = '';
        typingInput.classList.remove('correct-glow', 'error-glow');

        currentAttemptTotalTyped = 0;
        currentAttemptErrors = 0;

        renderWordStream();
        updateStatsDisplay();
        updateProgressBadge();

        showMessage(`next: "${currentWord}"`, '#84a6e0');
        typingInput.focus();
    }

    function showResult() {
        stopWpmTracking();

        const wpm = calculateWPM();
        let accuracy = 100;
        if (sessionTotalTyped > 0) {
            const correct = sessionTotalTyped - sessionErrorCount;
            accuracy = Math.max(0, Math.round((correct / sessionTotalTyped) * 100));
        }

        finalWpm.textContent = wpm;
        finalAccuracy.textContent = accuracy + '%';
        finalTyped.textContent = sessionTotalTyped;
        finalErrors.textContent = sessionErrorCount;
        finalSkipped.textContent = sessionSkippedCount;

        // 🕐 show total time
        if (testStartTime && testEndTime) {
            finalTime.textContent = formatTime(testEndTime - testStartTime);
        } else {
            finalTime.textContent = '00:00.0';
        }

        resultOverlay.classList.add('show');
    }

    function hideResult() {
        resultOverlay.classList.remove('show');
    }

    function restartTest() {
        hideResult();
        if (wpmInterval) clearInterval(wpmInterval);
        if (timerInterval) clearInterval(timerInterval);  // 🕐

        sessionTotalTyped = 0;
        sessionErrorCount = 0;
        sessionSkippedCount = 0;
        currentAttemptTotalTyped = 0;
        currentAttemptErrors = 0;
        isTransitioning = false;
        testStartTime = null;
        testEndTime = null;

        // 🕐 reset timer display
        timerDisplay.textContent = '00:00.0';
        timerBadge.classList.remove('running');

        allWords = shuffleArray(WORD_LIST);
        wordStatus = new Array(allWords.length).fill('pending');

        currentIndex = 0;
        currentWord = allWords[0];
        wordStatus[0] = 'active';

        typingInput.value = '';
        typingInput.disabled = false;
        typingInput.placeholder = 'type here...';
        typingInput.classList.remove('correct-glow', 'error-glow');

        updateStatsDisplay();
        updateProgressBadge();
        renderWordStream();
        wpmStat.textContent = '0';

        wordStreamPanel.scrollTop = 0;

        showMessage('new test started — type the word!', '#84a6e0');
        typingInput.focus();
    }

    function skipWord() {
        if (isTransitioning) return;
        if (typingInput.disabled) return;

        isTransitioning = true;

        wordStatus[currentIndex] = 'skipped';
        sessionSkippedCount++;
        skippedStat.textContent = sessionSkippedCount;

        showMessage(`⏭ skipped: "${currentWord}"`, '#f0c674');
        renderWordStream();

        typingInput.disabled = true;

        setTimeout(() => {
            typingInput.disabled = false;
            moveToNextWord();
            isTransitioning = false;
            typingInput.focus();
        }, 250);
    }

    function onTypingInput() {
        if (isTransitioning) return;
        if (currentIndex === -1) return;

        if (!testStartTime) {
            startWpmTracking();
            startTimerTracking();   // 🕐 start timer
        }

        const typed = typingInput.value;
        const target = currentWord;

        let attemptErrors = 0;
        const minLength = Math.min(typed.length, target.length);
        for (let i = 0; i < minLength; i++) {
            if (typed[i] !== target[i]) attemptErrors++;
        }
        if (typed.length > target.length) {
            attemptErrors += typed.length - target.length;
        }

        sessionTotalTyped = sessionTotalTyped - currentAttemptTotalTyped + typed.length;
        sessionErrorCount = sessionErrorCount - currentAttemptErrors + attemptErrors;

        currentAttemptTotalTyped = typed.length;
        currentAttemptErrors = attemptErrors;

        updateStatsDisplay();

        // ✅ CORRECT — auto next
        if (typed === target && typed.length > 0) {
            typingInput.classList.add('correct-glow');
            typingInput.classList.remove('error-glow');
            wordStatus[currentIndex] = 'done';
            renderWordStream();
            updateProgressBadge();

            showMessage('✓ correct! next word...', '#9fda8f');

            isTransitioning = true;
            typingInput.disabled = true;

            setTimeout(() => {
                typingInput.disabled = false;
                moveToNextWord();
                isTransitioning = false;
                typingInput.focus();
            }, 150);
            return;
        }

        typingInput.classList.remove('correct-glow');

        if (attemptErrors > 0 && typed.length > 0) {
            typingInput.classList.add('error-glow');
            wordStatus[currentIndex] = 'error';
            renderWordStream();
            showMessage('❌ wrong — fix it', '#c76b6b');
        } else {
            typingInput.classList.remove('error-glow');
            if (wordStatus[currentIndex] === 'error') {
                wordStatus[currentIndex] = 'active';
                renderWordStream();
            }
            if (typed.length === 0) {
                showMessage('', '#8a9bb8');
            } else if (typed.length < target.length) {
                showMessage('keep going...', '#8a9bb8');
            }
        }

        updateProgressBadge();
    }

    function onKeyDownHandler(e) {
        if (e.altKey && (e.key === 's' || e.key === 'S')) {
            e.preventDefault();
            skipWord();
            return;
        }
    }

    function init() {
        if (!WORD_LIST || WORD_LIST.length === 0) {
            showMessage('⚠️ no words found', '#c76b6b');
            return;
        }

        wordCountBadge.textContent = `${WORD_LIST.length} countries`;

        allWords = shuffleArray(WORD_LIST);
        wordStatus = new Array(allWords.length).fill('pending');

        currentIndex = 0;
        currentWord = allWords[0];
        wordStatus[0] = 'active';

        typingInput.value = '';
        typingInput.disabled = false;
        typingInput.placeholder = 'type here...';
        typingInput.classList.remove('correct-glow', 'error-glow');

        updateStatsDisplay();
        updateProgressBadge();
        renderWordStream();

        showMessage('type the word — auto next when complete', '#8a9bb8');
        typingInput.focus();

        typingInput.addEventListener('input', onTypingInput);
        document.addEventListener('keydown', onKeyDownHandler, true);
        skipBtn.addEventListener('click', skipWord);
        restartBtn.addEventListener('click', () => {
            typingInput.disabled = false;
            typingInput.placeholder = 'type here...';
            restartTest();
        });

        playAgainBtn.addEventListener('click', () => restartTest());
        closeResultBtn.addEventListener('click', () => hideResult());
        resultOverlay.addEventListener('click', (e) => {
            if (e.target === resultOverlay) hideResult();
        });
    }

    init();
</script>
</body>
</html>
